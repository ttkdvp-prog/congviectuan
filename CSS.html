<style>
/* ==============================================================================
   HỆ THỐNG QUẢN LÝ CÔNG VIỆC & HỒ SƠ TÀI LIỆU
   Modern Glassmorphism & Electric Indigo Gradient Design System
   ============================================================================== */

@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap');

:root {
  /* Color Tokens */
  --primary-gradient: linear-gradient(135deg, #4568dc 0%, #b06ab3 100%);
  --primary-color: #4568dc;
  --secondary-color: #b06ab3;
  --bg-color: #f4f6fb;
  --card-bg: rgba(255, 255, 255, 0.92);
  --glass-bg: rgba(255, 255, 255, 0.75);
  --glass-border: rgba(255, 255, 255, 0.4);
  --text-main: #2c3e50;
  --text-muted: #6c757d;
  --border-color: #e2e8f0;
  
  /* Status Colors */
  --status-doing: #3b82f6;
  --status-done: #10b981;
  --status-overdue: #ef4444;
  --status-canceled: #6b7280;
  
  /* Priority Colors */
  --priority-high: #f43f5e;
  --priority-med: #f59e0b;
  --priority-low: #06b6d4;

  /* Elevation Shadows */
  --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 8px 16px rgba(69, 104, 220, 0.08);
  --shadow-lg: 0 16px 32px rgba(69, 104, 220, 0.12);
  --radius-lg: 16px;
  --radius-md: 10px;
  --radius-sm: 6px;
  --transition: all 0.25s ease-in-out;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
  background-color: var(--bg-color);
  background-image: 
    radial-gradient(at 0% 0%, rgba(69, 104, 220, 0.08) 0px, transparent 50%),
    radial-gradient(at 100% 100%, rgba(176, 106, 179, 0.08) 0px, transparent 50%);
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Header & Top Bar */
.header {
  background: var(--primary-gradient);
  color: #ffffff;
  padding: 16px 32px;
  box-shadow: 0 4px 20px rgba(69, 104, 220, 0.2);
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 100;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-icon {
  width: 40px;
  height: 40px;
  background: rgba(255, 255, 255, 0.2);
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  backdrop-filter: blur(5px);
}

.brand-title {
  font-size: 1.3rem;
  font-weight: 700;
  letter-spacing: 0.5px;
}

.brand-subtitle {
  font-size: 0.8rem;
  opacity: 0.85;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

/* Navigation Tabs */
.nav-container {
  background: #ffffff;
  border-bottom: 1px solid var(--border-color);
  padding: 0 32px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
}

.nav-tabs {
  display: flex;
  gap: 8px;
}

.tab-btn {
  padding: 14px 20px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  font-weight: 500;
  font-size: 0.95rem;
  cursor: pointer;
  border-bottom: 3px solid transparent;
  transition: var(--transition);
  display: flex;
  align-items: center;
  gap: 8px;
}

.tab-btn:hover {
  color: var(--primary-color);
  background: rgba(69, 104, 220, 0.04);
}

.tab-btn.active {
  color: var(--primary-color);
  border-bottom-color: var(--primary-color);
  font-weight: 700;
}

.view-switcher {
  display: flex;
  background: #f1f5f9;
  padding: 4px;
  border-radius: var(--radius-md);
  gap: 4px;
}

.view-btn {
  padding: 8px 16px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  font-size: 0.85rem;
  font-weight: 500;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: var(--transition);
  display: flex;
  align-items: center;
  gap: 6px;
}

.view-btn:hover {
  color: var(--text-main);
}

.view-btn.active {
  background: #ffffff;
  color: var(--primary-color);
  box-shadow: var(--shadow-sm);
  font-weight: 700;
}

/* Main Container & Filters */
.main-content {
  flex: 1;
  padding: 24px 32px;
  max-width: 1600px;
  margin: 0 auto;
  width: 100%;
}

.filter-bar {
  background: var(--card-bg);
  backdrop-filter: blur(10px);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  padding: 16px 20px;
  margin-bottom: 24px;
  box-shadow: var(--shadow-md);
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  align-items: center;
  justify-content: space-between;
}

.search-box {
  position: relative;
  flex: 1;
  min-width: 260px;
}

.search-box input {
  width: 100%;
  padding: 10px 16px 10px 40px;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  outline: none;
  font-size: 0.9rem;
  transition: var(--transition);
}

.search-box input:focus {
  border-color: var(--primary-color);
  box-shadow: 0 0 0 3px rgba(69, 104, 220, 0.15);
}

.search-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
}

.filter-group {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
}

.select-control, .date-control {
  padding: 10px 14px;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  background: #ffffff;
  color: var(--text-main);
  font-size: 0.88rem;
  outline: none;
  cursor: pointer;
  transition: var(--transition);
}

.select-control:focus, .date-control:focus {
  border-color: var(--primary-color);
}

/* Action Buttons */
.btn {
  padding: 10px 20px;
  border: none;
  border-radius: var(--radius-md);
  font-size: 0.9rem;
  font-weight: 500;
  cursor: pointer;
  transition: var(--transition);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.btn-primary {
  background: var(--primary-gradient);
  color: #ffffff;
  box-shadow: 0 4px 12px rgba(69, 104, 220, 0.25);
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(69, 104, 220, 0.35);
}

.btn-secondary {
  background: #ffffff;
  border: 1px solid var(--border-color);
  color: var(--text-main);
}

.btn-secondary:hover {
  background: #f8fafc;
  border-color: #cbd5e1;
}

.btn-danger {
  background: #ef4444;
  color: #ffffff;
}

.btn-danger:hover {
  background: #dc2626;
}

.btn-sm {
  padding: 6px 12px;
  font-size: 0.8rem;
  border-radius: var(--radius-sm);
}

/* KANBAN BOARD VIEW */
.kanban-board {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  align-items: start;
}

.kanban-col {
  background: rgba(241, 245, 249, 0.8);
  border: 1px solid rgba(226, 232, 240, 0.8);
  border-radius: var(--radius-lg);
  padding: 16px;
  min-height: 550px;
  display: flex;
  flex-direction: column;
}

.col-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 2px solid rgba(0, 0, 0, 0.05);
}

.col-title {
  font-weight: 700;
  font-size: 1rem;
  display: flex;
  align-items: center;
  gap: 8px;
}

.col-count {
  background: #ffffff;
  padding: 2px 8px;
  border-radius: 12px;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-muted);
  box-shadow: var(--shadow-sm);
}

.col-doing .col-title { color: var(--status-doing); }
.col-done .col-title { color: var(--status-done); }
.col-overdue .col-title { color: var(--status-overdue); }
.col-canceled .col-title { color: var(--status-canceled); }

.kanban-cards {
  display: flex;
  flex-direction: column;
  gap: 14px;
  flex: 1;
  min-height: 200px;
}

.kanban-cards.drag-over {
  background: rgba(69, 104, 220, 0.08);
  border: 2px dashed var(--primary-color);
  border-radius: var(--radius-md);
}

.task-card {
  background: #ffffff;
  border-radius: var(--radius-md);
  padding: 16px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-color);
  cursor: grab;
  transition: var(--transition);
  position: relative;
  overflow: hidden;
}

.task-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-md);
  border-color: rgba(69, 104, 220, 0.3);
}

.task-card.dragging {
  opacity: 0.5;
  cursor: grabbing;
}

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 8px;
}

.card-title {
  font-weight: 600;
  font-size: 0.95rem;
  line-height: 1.35;
  color: var(--text-main);
}

.badge {
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  white-space: nowrap;
}

.badge-high { background: rgba(244, 63, 94, 0.12); color: var(--priority-high); }
.badge-med { background: rgba(245, 158, 11, 0.12); color: var(--priority-med); }
.badge-low { background: rgba(6, 182, 212, 0.12); color: var(--priority-low); }

.card-desc {
  font-size: 0.82rem;
  color: var(--text-muted);
  margin-bottom: 12px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.progress-container {
  margin-bottom: 12px;
}

.progress-info {
  display: flex;
  justify-content: space-between;
  font-size: 0.75rem;
  color: var(--text-muted);
  margin-bottom: 4px;
}

.progress-bar-bg {
  height: 6px;
  background: #e2e8f0;
  border-radius: 3px;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  background: var(--primary-gradient);
  border-radius: 3px;
  transition: width 0.4s ease;
}

.card-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 10px;
  border-top: 1px solid #f1f5f9;
  font-size: 0.78rem;
  color: var(--text-muted);
}

.assignee-info {
  display: flex;
  align-items: center;
  gap: 6px;
}

.avatar {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--primary-gradient);
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 0.75rem;
}

.due-date {
  display: flex;
  align-items: center;
  gap: 4px;
}

.due-date.is-overdue {
  color: var(--status-overdue);
  font-weight: 600;
}

/* LIST VIEW (TABLE) */
.table-container {
  background: #ffffff;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
  border: 1px solid var(--border-color);
  overflow-x: auto;
}

.custom-table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  font-size: 0.9rem;
}

.custom-table th {
  background: #f8fafc;
  padding: 14px 16px;
  font-weight: 600;
  color: var(--text-muted);
  border-bottom: 2px solid var(--border-color);
  white-space: nowrap;
}

.custom-table td {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border-color);
  vertical-align: middle;
}

.custom-table tbody tr:hover {
  background: rgba(69, 104, 220, 0.02);
}

/* GANTT CHART TIMELINE VIEW */
.gantt-wrapper {
  background: #ffffff;
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-color);
  box-shadow: var(--shadow-md);
  padding: 20px;
  overflow-x: auto;
}

.gantt-header-months {
  display: flex;
  border-bottom: 2px solid var(--border-color);
  margin-bottom: 12px;
}

.gantt-month-cell {
  flex: 1;
  min-width: 160px;
  text-align: center;
  padding: 10px;
  font-weight: 700;
  color: var(--primary-color);
  border-right: 1px solid var(--border-color);
  background: #f8fafc;
}

.gantt-rows {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.gantt-row {
  display: flex;
  align-items: center;
  height: 48px;
  position: relative;
  border-bottom: 1px dashed #e2e8f0;
}

.gantt-label {
  width: 240px;
  min-width: 240px;
  padding-right: 16px;
  font-size: 0.88rem;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.gantt-timeline-track {
  flex: 1;
  height: 100%;
  position: relative;
  background: repeating-linear-gradient(
    90deg,
    #ffffff,
    #ffffff 39px,
    #f8fafc 40px
  );
}

.gantt-bar {
  position: absolute;
  height: 28px;
  top: 10px;
  border-radius: 14px;
  background: var(--primary-gradient);
  color: #ffffff;
  font-size: 0.75rem;
  font-weight: 600;
  padding: 0 12px;
  display: flex;
  align-items: center;
  box-shadow: 0 2px 8px rgba(69, 104, 220, 0.3);
  transition: var(--transition);
  cursor: pointer;
  white-space: nowrap;
}

.gantt-bar:hover {
  transform: scaleY(1.1);
  box-shadow: 0 4px 12px rgba(69, 104, 220, 0.4);
}

/* MODAL & DRAWER STYLES */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(15, 23, 42, 0.5);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  opacity: 0;
  visibility: hidden;
  transition: var(--transition);
}

.modal-overlay.active {
  opacity: 1;
  visibility: visible;
}

.modal-card {
  background: #ffffff;
  border-radius: var(--radius-lg);
  width: 90%;
  max-width: 650px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
  transform: translateY(20px) scale(0.98);
  transition: var(--transition);
}

.modal-overlay.active .modal-card {
  transform: translateY(0) scale(1);
}

.modal-header {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #f8fafc;
}

.modal-title {
  font-weight: 700;
  font-size: 1.15rem;
  color: var(--text-main);
}

.close-btn {
  background: transparent;
  border: none;
  font-size: 1.4rem;
  color: var(--text-muted);
  cursor: pointer;
}

.modal-body {
  padding: 24px;
}

.form-group {
  margin-bottom: 18px;
}

.form-group label {
  display: block;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-main);
  margin-bottom: 6px;
}

.form-control {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  font-size: 0.9rem;
  outline: none;
  transition: var(--transition);
}

.form-control:focus {
  border-color: var(--primary-color);
  box-shadow: 0 0 0 3px rgba(69, 104, 220, 0.15);
}

.form-row {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
}

.subtasks-builder {
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 12px;
  background: #f8fafc;
}

.subtask-item {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}

.subtask-item input[type="text"] {
  flex: 1;
}

.skeleton {
  background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
  background-size: 200% 100%;
  animation: skeleton-loading 1.5s infinite;
  border-radius: var(--radius-sm);
}

@keyframes skeleton-loading {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

@media (max-width: 1024px) {
  .kanban-board {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 640px) {
  .header {
    padding: 12px 16px;
    flex-direction: column;
    gap: 12px;
  }
  .nav-container {
    padding: 0 16px;
    flex-direction: column;
    gap: 12px;
  }
  .kanban-board {
    grid-template-columns: 1fr;
  }
  .main-content {
    padding: 16px;
  }
  .form-row {
    grid-template-columns: 1fr;
  }
}
</style>
